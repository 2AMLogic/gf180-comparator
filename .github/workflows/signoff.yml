name: Signoff

# Mechanical re-grading of the klt-signoff block manifest -- the verdict of
# record for this block's T1 (sim-validated) status per
# klayout-tools/docs/design-evidence-tiers.md, replacing the hand-maintained
# checklist in the gap-to-T1 tracker (issue #3). Landed by issue #57;
# per-criterion contract: a manifest citing an artifact that has since
# changed fails here instead of rotting.
#
# PDK-free by design: `klt signoff --manifest` on file-backed citations
# grades committed evidence envelopes, it never runs DRC/LVS/sim gates, so
# this job needs no PDK download, no xschem, no ngspice -- it runs on a bare
# ubuntu runner with python3 only.
#
# What is checked (all inside signoff/verify-report.py):
#   1. `klt signoff --manifest signoff/block-manifest.json
#      --tiers-doc signoff/design-evidence-tiers.md --format json` runs.
#      Exit 3 means "graded below T1" (unmet items exist) and is data, not
#      failure; exit 1 (a real error) fails the job.
#   2. The fresh per-item grades match the committed verdict of record
#      (signoff/signoff-report.json), so a manifest or evidence envelope
#      edited without re-grading and re-committing the report cannot pass.
#   3. Every pinned content_hash matches the current bytes of the artifact it
#      names, so a manifest citing an artifact that has since changed fails
#      rather than rotting.
#
# A second, klt-free step (issue #84) keeps the integrator-facing maturity
# claim honest: manifests/verify-integrator.py fails unless
# manifests/integrator.json's maturity.rung equals the committed report's
# tier (null or a supported T1-T4 ladder value) -- the structured manifest
# can never advertise a tier the verdict of record does not support.
#
# The job also runs the PDK-free sim/harness unittest suite (issue #110),
# the same command as package.json's `npm test`, and the PDK-free netlist
# source-pin check (issue #120, design/verify-netlist-pins.py --check).
#
# Both pins below are load-bearing and MUST stay in sync with
# signoff/regenerate.sh and signoff/README.md ("The two pins"):
#   - the distribution: klayout-tools==0.6.0, the PyPI registry wheel (the
#     release whose byte-identical wheel graded the committed report;
#     same-version snapshots grade differently);
#   - the rulebook: the vendored signoff/design-evidence-tiers.md, the
#     11-item checklist including item 11 (Power delivery, structural,
#     klayout-tools#2025) which shipped after the 0.5.0 release -- the
#     wheel's bundled copy is the older 10-item one, so grading without the
#     vendored doc would disagree with the verdict of record on
#     t1_item_count and the verifier fails it by name.
# When a klayout-tools release carrying the 11-item rulebook ships, move
# both pins forward and re-grade per signoff/README.md's refresh contract.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: signoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signoff:
    name: klt signoff --manifest (re-grade committed evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Issue #110: the PDK-free harness regressions (deck composition, corner
      # identities, offset probes, evidence reservation). Same command as
      # package.json's `npm test`, run directly so CI needs no Node. Stdlib
      # unittest with mocked simulator calls: no PDK, no ngspice, no downloads.
      # A failing test exits non-zero and fails the job.
      - name: Run harness regression tests (PDK-free)
        run: python3 -m unittest discover -s sim/harness/tests -v

      # Issue #120: PDK-free, xschem-free source pins for the netlist. Fails if
      # any schematic input (design/comparator.sch + in-repo sub-cell .sch/.sym)
      # or design/comparator.spice changed since ./design/netlist.sh last wrote
      # design/comparator.sources.json, or if the pin file is missing. Proves
      # the sch->spice step was re-run after the last edit -- NOT that the
      # netlist is the correct xschem output (./design/netlist.sh --check,
      # which needs xschem + PDK, is the only check of that). Then the
      # verifier's own temp-fixture regressions.
      - name: Netlist source-pin check (PDK-free)
        run: |
          python3 design/verify-netlist-pins.py --check
          python3 design/tests/test_verify_netlist_pins.py

      # Keep this pin in sync with signoff/regenerate.sh's KLT_VERSION. The
      # released registry wheel carries the git-tag identity regenerate.sh
      # asserts; same-version snapshots can grade differently.
      - name: Install the pinned grading klt (klayout-tools)
        run: |
          python -m pip install --upgrade pip
          python -m pip install klayout-tools==0.6.0
          klt version --format json

      - name: Re-grade the manifest and verify the committed pins
        run: python3 signoff/verify-report.py

      # Issue #108: the item-5 wrapper must keep incomplete average-power
      # coverage from grading `met`. PDK-free; the grader case uses the
      # pinned klt installed above (skipped by name if klt is absent, which
      # it never is in this job). Also re-derives the committed envelope.
      - name: Item-5 corner-matrix wrapper regressions
        run: |
          python3 signoff/make_item5_envelope.py --check
          python3 signoff/tests/test_item5_envelope.py

      # Issue #111: signoff/verify-report.py (the step above) now also runs
      # both wrappers' --check; these temporary-fixture regressions prove
      # source-record / envelope drift is reported. PDK-free, no klt needed.
      - name: Wrapper freshness-check regressions
        run: python3 signoff/tests/test_verify_wrappers.py

      # Issue #84: the integrator view's maturity rung must mirror the
      # committed verdict of record. No klt needed -- two committed JSON
      # files. Fails on any mismatch (either direction) or a prose rung.
      - name: Verify integrator manifest maturity consistency
        run: python3 manifests/verify-integrator.py

      # The verifier's own regression matrix (issue #84, added in the PR #93
      # review round): doctored sandbox pairs must exit with the contracted
      # status, including the malformed-report case (a missing tier key
      # must FAIL, never pass as an implicit null).
      - name: Run integrator verifier regression matrix
        run: python3 manifests/test-verify-integrator.py
