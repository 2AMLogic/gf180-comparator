name: Signoff

# Mechanical re-grading of the klt-signoff block manifest -- the verdict of
# record for this block's T1 (sim-validated) status per
# klayout-tools/docs/design-evidence-tiers.md, replacing the hand-maintained
# checklist in the gap-to-T1 tracker (issue #3). Landed by issue #57;
# per-criterion contract: a manifest citing an artifact that has since
# changed fails here instead of rotting.
#
# PDK-free by design: `klt signoff --manifest` on file-backed citations
# grades committed evidence envelopes, it never runs DRC/LVS/sim gates, so
# this job needs no PDK download, no xschem, no ngspice -- it runs on a bare
# ubuntu runner with python3 only.
#
# What is checked (all inside signoff/verify-report.py):
#   1. `klt signoff --manifest signoff/block-manifest.json
#      --tiers-doc signoff/design-evidence-tiers.md --format json` runs.
#      Exit 3 means "graded below T1" (unmet items exist) and is data, not
#      failure; exit 1 (a real error) fails the job.
#   2. The fresh per-item grades match the committed verdict of record
#      (signoff/signoff-report.json), so a manifest or evidence envelope
#      edited without re-grading and re-committing the report cannot pass.
#   3. Every pinned content_hash matches the current bytes of the artifact it
#      names, so a manifest citing an artifact that has since changed fails
#      rather than rotting.
#
# A second, klt-free step (issue #84) keeps the integrator-facing maturity
# claim honest: manifests/verify-integrator.py fails unless
# manifests/integrator.json's maturity.rung equals the committed report's
# tier (null or a supported T1-T4 ladder value) -- the structured manifest
# can never advertise a tier the verdict of record does not support. Issue
# #161 extends it to the structural fields: published paths resolve to tracked
# files, netlist path/top subckt/ordered ports agree with the active DUT
# binding (sim/dut.json via sim/harness/dut.py), and top_cell/area agree with
# the placement envelope's bbox within documented rounding tolerances.
#
# A klt-free `evidence` step (issue #135) enforces sim/ append-only evidence:
# signoff/check_append_only_evidence.py fails if any committed protected sim
# artifact is modified, deleted, re-moded or moved (see sim/README.md).
#
# The job runs scripts/run-pdk-free-tests.sh (issue #129), the same script as
# package.json's `npm test`: the sim/harness unittest suite (#110), the netlist
# source-pin check (#120), and every other PDK-free test and --check verifier.
#
# Both pins below are load-bearing and MUST stay in sync with
# signoff/regenerate.sh and signoff/README.md ("The two pins"):
#   - the distribution: klayout-tools==0.6.0, the PyPI registry wheel (the
#     release whose byte-identical wheel graded the committed report;
#     same-version snapshots grade differently);
#   - the rulebook: the vendored signoff/design-evidence-tiers.md, the
#     11-item checklist (item 11, Power delivery, structural,
#     klayout-tools#2025, shipped after the 0.5.0 release) verbatim at
#     klayout-tools commit 31a3e3c4. The pinned 0.6.0 wheel bundles an
#     11-item rulebook too, but its bytes differ from the vendored copy (it
#     is newer), so every grade passes --tiers-doc with the vendored file and
#     the verifier fails, by name, any grade whose source_doc is the wheel's
#     bundled copy. The vendored bytes are pinned by
#     signoff/design-evidence-tiers.md.sha256 and checked by
#     signoff/check_rulebook_pin.py (issue #168: the `rulebook-pin` step and
#     check 0 of verify-report.py), so a prose-only edit fails too.
# Re-vendoring the rulebook, or dropping --tiers-doc in favour of the wheel's
# bundled copy, is a deliberate separate change that re-grades per
# signoff/README.md ("The two pins" and its refresh contract).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Policy: a started verification on main must finish (a cancelled run leaves
# the commit without a verdict); superseded PR runs may be cancelled.
concurrency:
  group: signoff-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signoff:
    name: klt signoff --manifest (re-grade committed evidence)
    runs-on: ubuntu-latest
    # Issue #135: the append-only sim/ evidence guard (`evidence` step of
    # scripts/run-pdk-free-tests.sh) compares event-specific commits, never the
    # checkout's HEAD. pull_request: merge-base(PR base, PR head) .. PR head
    # (HEAD there is GitHub's synthetic merge commit). push: before .. after,
    # the whole push including forced pushes. The SHAs travel ONLY as env
    # values -- never `${{ }}`-interpolated into a run: script -- and the
    # verifier validates them as full hex SHAs and fails (never skips) in CI
    # when any is missing, all-zero, or unavailable.
    env:
      APPEND_ONLY_EVENT: ${{ github.event_name }}
      APPEND_ONLY_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      APPEND_ONLY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      APPEND_ONLY_PUSH_BEFORE: ${{ github.event.before }}
      APPEND_ONLY_PUSH_AFTER: ${{ github.event.after }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so merge bases resolve (issue #135).
          fetch-depth: 0

      # A forced push's `before` (or a fork PR's head) need not be reachable
      # from any fetched ref; fetch each event commit explicitly. A failed
      # fetch is not fatal here: the verifier then fails with a named
      # diagnostic instead of skipping.
      - name: Fetch the event commits for the append-only evidence check
        run: |
          for sha in "$APPEND_ONLY_PR_BASE_SHA" "$APPEND_ONLY_PR_HEAD_SHA" \
                     "$APPEND_ONLY_PUSH_BEFORE" "$APPEND_ONLY_PUSH_AFTER"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || continue
            [[ "$sha" =~ ^0+$ ]] && continue
            git cat-file -e "$sha^{commit}" 2>/dev/null && continue
            git fetch --no-tags origin "$sha" || echo "::warning::could not fetch $sha"
          done

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Keep this pin in sync with signoff/regenerate.sh's KLT_VERSION. The
      # released registry wheel carries the git-tag identity regenerate.sh
      # asserts; same-version snapshots can grade differently.
      - name: Install the pinned grading klt (klayout-tools)
        run: |
          python -m pip install --upgrade pip
          python -m pip install klayout-tools==0.6.0
          klt version --format json

      # Issue #129: the single enumeration of PDK-free tests and --check
      # verifiers lives in scripts/run-pdk-free-tests.sh (also `npm test`).
      # Each step there is a collapsed ::group:: named as the old CI step was
      # (harness #110, netlist pins #120, grader pin #128, re-grade, item-5
      # #108, append-only evidence #135, wrapper/integrator regressions
      # #111/#84), failures are
      # annotated with ::error::, and a summary lists every failed step. A new
      # test_*.py under a covered directory is picked up with no edit here.
      - name: Run PDK-free tests and verifiers (scripts/run-pdk-free-tests.sh)
        run: ./scripts/run-pdk-free-tests.sh
